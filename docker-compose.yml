services:
  postgres:
    image: postgres:17
    container_name: buildingfex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: buildingfex
      POSTGRES_DB: buildingfex
    ports:
      - "5432:5432"
    volumes:
      - buildingfex_postgres_data:/var/lib/postgresql/data

volumes:
  buildingfex_postgres_data:
