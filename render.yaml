# Render Blueprint para BuildingFex API (infraestructura como código).
#
# Este archivo declara el stack existente para que Render lo gestione solo:
#   - El web service BackEnd-1 (Docker).
#   - La base de datos PostgreSQL "BuildingFexDB" (display name; internamente
#     la base se llama buildingfexdb y el usuario buildingfexdb_user).
#   - DATABASE_URL se inyecta SOLO desde la BD vía `fromDatabase`, por lo
#     que NO se guarda ningún secreto de BD en este repo (es público).
#
# CÓMO ADOPTAR LOS RECURSOS EXISTENTES (importante):
#   El servicio y la BD ya fueron creados a mano en el dashboard. Al crear el
#   Blueprint, Render empareja por NOMBRE: si el nombre coincide con un
#   recurso existente lo ADOPTA; si no, crea uno NUEVO (p. ej. una segunda
#   BD vacía). Por eso los nombres de abajo coinciden con los reales.
#   Revisá SIEMPRE la preview de "New -> Blueprint" antes de confirmar:
#   si propone crear recursos nuevos en vez de adoptar los existentes, no
#   confirmes y ajustá el `name` al recurso real del dashboard.
#
# Variables marcadas `sync: false` se completan desde el panel (no van al repo).

services:
  - type: web
    name: BackEnd-1          # nombre EXACTO del servicio existente (lo adopta)
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health  # verificado: responde 200 {"status":"ok"}
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # Secreto JWT: el valor YA existe en el panel y se conserva (no se
      # regenera, para no invalidar los tokens vigentes). No va al repo.
      - key: TokenSettings__Secret
        sync: false

      # Render inyecta el connection string (postgresql://...) de la BD
      # declarada en `databases` de abajo. El código lo lee primero
      # (CloudHosting.ResolveConnectionString -> DATABASE_URL).
      - key: DATABASE_URL
        fromDatabase:
          name: BuildingFexDB          # debe coincidir con databases[].name
          property: connectionString

      # MercadoPago: secretos/configuración fuera del repo.
      - key: MercadoPago__AccessToken
        sync: false
      - key: MercadoPago__PublicKey
        sync: false
      - key: MercadoPago__WebhookSecret
        sync: false

      # Origen del frontend (Vercel u otro), separado por coma si hay varios.
      - key: MercadoPago__FrontendBaseUrl
        sync: false

      # Webhook de pagos de este servicio:
      # https://backend-1-lgr7.onrender.com/api/v1/payments/webhook
      - key: MercadoPago__NotificationUrl
        sync: false

      # Origenes permitidos por CORS. Sin esto, cualquier origen es aceptado.
      - key: Cors__AllowedOrigins
        sync: false

databases:
  - name: BuildingFexDB      # display name EXACTO de la BD existente (lo adopta).
                             # Verificado por API (/v1/postgres). OJO: es
                             # distinto de `databaseName` (buildingfexdb).
    databaseName: buildingfexdb
    user: buildingfexdb_user
    plan: free
    region: oregon
